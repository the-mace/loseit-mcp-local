# After CI passes on a Dependabot PR, approve and squash-merge it.
# Human PRs are left alone — branch protection on main requires 1 review
# for those. Only dependabot[bot] PRs are approved/merged here.
#
# Repo settings this relies on:
# - Actions → Workflow permissions → "Allow GitHub Actions to create and
#   approve pull requests" (can_approve_pull_request_reviews)
# - Branch protection on main: 1 approving review + required check "test"
# - Allow squash merge (we merge directly; "Allow auto-merge" is optional)
name: Dependabot auto-merge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  dependabot:
    runs-on: ubuntu-latest
    # Only act on successful CI runs that were triggered by a pull_request.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Find Dependabot PR for this commit
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          # commits/{sha}/pulls needs the pull-requests media type / Accept
          # header; gh api sets that when querying this endpoint.
          pr_json=$(gh api "repos/${REPO}/commits/${SHA}/pulls" \
            --jq '[.[] | select(.user.login == "dependabot[bot]")] | .[0] // empty')
          if [ -z "$pr_json" ]; then
            echo "No Dependabot PR for ${SHA}; nothing to merge."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          number=$(printf '%s' "$pr_json" | jq -r .number)
          url=$(printf '%s' "$pr_json" | jq -r .html_url)
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "number=${number}" >> "$GITHUB_OUTPUT"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "Dependabot PR #${number}: ${url}"

      - name: Approve PR
        if: steps.pr.outputs.skip != 'true'
        run: |
          # Satisfies branch protection's required review. GITHUB_TOKEN may
          # approve because repo setting can_approve_pull_request_reviews is on.
          if ! gh pr review --approve "$PR_URL"; then
            echo "::error::Could not approve. Check Actions → Workflow permissions → Allow GitHub Actions to create and approve pull requests."
            exit 1
          fi
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Squash-merge
        if: steps.pr.outputs.skip != 'true'
        run: |
          # CI already passed (this job only runs on workflow_run success).
          # Immediate merge can fail when another PR landed first ("Base branch
          # was modified" / branch behind). Fall back to GitHub auto-merge so
          # it merges once the branch is up to date and checks re-pass.
          if gh pr merge --squash --delete-branch "$PR_URL"; then
            echo "Merged."
            exit 0
          fi
          echo "Immediate merge failed; enabling auto-merge..."
          if gh pr merge --squash --auto --delete-branch "$PR_URL"; then
            echo "Auto-merge enabled."
            exit 0
          fi
          echo "Could not merge or enable auto-merge (already merged, conflict, or protection)."
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
